name: tkhello
description: Hello world CLI that tells how and from where it was installed and launched.
version: 1.0.0
publish_to: none
repository: https://github.com/tekartik/pubglobalupdate.dart/tree/main/example/packages/tkhello

environment:
  sdk: ^3.10.0
resolution: workspace

dependencies:
  args: ">=2.7.0 <4.0.0"
  path: ">=1.9.1 <3.0.0"
  process_run: ">=1.3.7 <3.0.0"

dev_dependencies:
  lints: ">=6.1.0"
  test: ">=1.30.0"

executables:
  # bin/main.dart, to check the name != script mapping in both tools
  tkhello: main
